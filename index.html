<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Postype</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Postype" />
  <meta name="theme-color" content="#FAF8F5" id="meta-theme-color" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    :root {
      --bg: #FAF8F5;
      --surface: #FFFFFF;
      --surface-soft: #F3EFE9;
      --border: rgba(31, 30, 28, 0.08);
      --border-strong: rgba(31, 30, 28, 0.14);
      --text: #1F1E1C;
      --text-sub: #6F6B64;
      --text-muted: #9C968C;
      --accent: #2C2A27;
      --accent-soft: #EDE7DD;
      --warm: #B88753;
      --danger: #C24B4B;
      --shadow: 0 8px 28px rgba(24, 21, 17, 0.08);
      --hl-yellow: rgba(250, 223, 128, 0.52);
      --hl-pink: rgba(246, 189, 198, 0.52);
      --hl-mint: rgba(173, 226, 214, 0.52);
      --hl-blue: rgba(182, 213, 248, 0.52);
      --note-bg: #F8F3EA;
      --note-border: #E8DAC3;
      --ko-bg: #F4F0E8;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --reader-size: 17px;
      --reader-lh: 1.85;
    }

    body[data-theme="paper"] {
      --bg: #F6EFE2;
      --surface: #FCF8F0;
      --surface-soft: #ECE2D0;
      --border: rgba(65, 50, 32, 0.1);
      --border-strong: rgba(65, 50, 32, 0.18);
      --text: #2F261D;
      --text-sub: #6E5F4E;
      --text-muted: #9A8A76;
      --accent: #3C3024;
      --accent-soft: #E5D9C3;
      --note-bg: #F2E8D5;
      --note-border: #DFCEB0;
      --ko-bg: #EDE3D1;
    }

    body[data-theme="dark"] {
      --bg: #151514;
      --surface: #1E1E1C;
      --surface-soft: #272724;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.15);
      --text: #E5E1D9;
      --text-sub: #A29D93;
      --text-muted: #706B63;
      --accent: #E5E1D9;
      --accent-soft: #2D2C29;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      --hl-yellow: rgba(214, 178, 72, 0.34);
      --hl-pink: rgba(212, 126, 142, 0.34);
      --hl-mint: rgba(102, 178, 162, 0.34);
      --hl-blue: rgba(112, 158, 212, 0.34);
      --note-bg: #26231D;
      --note-border: #3B3429;
      --ko-bg: #23221F;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Apple SD Gothic Neo", "Noto Sans SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea, select {
      font: inherit;
      color: inherit;
    }

    button {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .hidden { display: none !important; }

    /* Views */
    .view {
      min-height: 100vh;
      max-width: 720px;
      margin: 0 auto;
      padding-bottom: calc(28px + var(--safe-bottom));
    }

    /* Top Nav */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: calc(12px + var(--safe-top)) 18px 12px;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 36px;
      min-width: 36px;
      padding: 0 10px;
      border-radius: 10px;
      color: var(--text-sub);
      transition: background 0.15s, color 0.15s;
    }

    .icon-btn:active {
      background: var(--surface-soft);
      color: var(--text);
    }

    .primary-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 34px;
      padding: 0 13px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--bg);
      font-size: 13px;
      font-weight: 600;
    }

    .primary-pill:active { opacity: 0.85; }

    /* Search & Filter */
    .shelf-controls {
      padding: 14px 18px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box svg {
      position: absolute;
      left: 13px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 40px;
      padding: 0 36px 0 38px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 14px;
      outline: none;
    }

    .search-input:focus { border-color: var(--border-strong); }

    .search-clear {
      position: absolute;
      right: 8px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .seg-tabs {
      display: inline-flex;
      gap: 4px;
      background: var(--surface-soft);
      padding: 3px;
      border-radius: 10px;
    }

    .seg-tab {
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-sub);
      transition: all 0.15s;
    }

    .seg-tab.active {
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    .mode-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 12.5px;
      color: var(--text-sub);
    }

    .mode-btn.active {
      border-color: var(--accent);
      color: var(--text);
      font-weight: 600;
    }

    /* Shelf List */
    .shelf-list {
      padding: 6px 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .author-group {
      margin-bottom: 14px;
    }

    .author-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 4px 10px;
    }

    .author-title-wrap {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .author-name {
      font-size: 15px;
      font-weight: 700;
    }

    .author-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .author-edit-btn {
      font-size: 12px;
      color: var(--text-sub);
      padding: 4px 9px;
      border-radius: 7px;
      background: var(--surface-soft);
    }

    .book-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px 16px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      transition: transform 0.12s;
    }

    .book-card:active { transform: scale(0.992); }

    .book-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .book-title {
      font-size: 16px;
      font-weight: 650;
      line-height: 1.42;
      word-break: break-word;
    }

    .card-more {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      margin: -4px -6px 0 0;
      border-radius: 8px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .book-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12.5px;
      color: var(--text-sub);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      background: var(--surface-soft);
      color: var(--text-sub);
    }

    .badge-bi {
      background: var(--note-bg);
      color: var(--warm);
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 2px;
    }

    .progress-track {
      flex: 1;
      height: 3.5px;
      border-radius: 99px;
      background: var(--surface-soft);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--warm);
    }

    .progress-label {
      font-size: 11.5px;
      color: var(--text-muted);
      min-width: 34px;
      text-align: right;
    }

    /* Empty State */
    .empty-state {
      margin: 34px 18px;
      padding: 32px 22px;
      border-radius: 18px;
      border: 1px dashed var(--border-strong);
      background: var(--surface);
      text-align: center;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 650;
      margin: 0 0 8px;
    }

    .empty-desc {
      font-size: 13.5px;
      color: var(--text-sub);
      line-height: 1.65;
      margin: 0 0 18px;
    }

    /* Reader View */
    #reader-view {
      max-width: 720px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: calc(92px + var(--safe-bottom));
    }

    .reader-topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: calc(10px + var(--safe-top)) 14px 10px;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      transition: transform 0.22s ease, opacity 0.22s ease;
    }

    .reader-topbar.bars-hidden {
      transform: translateY(-105%);
      opacity: 0;
      pointer-events: none;
    }

    .reader-topbar-inner {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .reader-nav-title {
      flex: 1;
      font-size: 14.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      padding-right: 36px;
    }

    .reader-article {
      padding: calc(74px + var(--safe-top)) 22px 48px;
    }

    .article-head {
      padding-bottom: 22px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .article-title {
      font-size: 23px;
      font-weight: 700;
      line-height: 1.38;
      margin: 0 0 10px;
      letter-spacing: -0.01em;
    }

    .article-sub {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      color: var(--text-sub);
    }

    .para-block {
      margin: 0 0 1.05em;
      touch-action: manipulation;
      border-radius: 8px;
      transition: background 0.35s ease;
    }

    .para-block.pulse {
      background: var(--hl-yellow);
    }

    .para-zh {
      font-size: var(--reader-size);
      line-height: var(--reader-lh);
      word-break: break-word;
      white-space: pre-wrap;
      user-select: text;
      -webkit-user-select: text;
    }

    .para-block.type-heading .para-zh {
      font-size: calc(var(--reader-size) + 3px);
      font-weight: 700;
      margin-top: 1.3em;
    }

    .para-block.type-quote .para-zh {
      padding-left: 14px;
      border-left: 3px solid var(--warm);
      color: var(--text-sub);
    }

    .para-ko {
      display: none;
      margin-top: 8px;
      padding: 10px 13px;
      border-radius: 10px;
      background: var(--ko-bg);
      color: var(--text-sub);
      font-size: calc(var(--reader-size) - 2px);
      line-height: 1.72;
      white-space: pre-wrap;
      user-select: text;
      -webkit-user-select: text;
    }

    .para-block.show-ko .para-ko {
      display: block;
    }

    .para-img-wrap {
      margin: 18px 0;
      text-align: center;
    }

    .para-img-wrap img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      display: block;
      margin: 0 auto;
    }

    .para-hr {
      border: none;
      border-top: 1px solid var(--border-strong);
      margin: 26px auto;
      width: 44%;
    }

    mark.hl {
      color: inherit;
      padding: 1px 0;
      border-radius: 3px;
      cursor: pointer;
    }
    mark.hl-yellow { background: var(--hl-yellow); }
    mark.hl-pink { background: var(--hl-pink); }
    mark.hl-mint { background: var(--hl-mint); }
    mark.hl-blue { background: var(--hl-blue); }

    /* Reader Bottom Bar */
    .reader-bottombar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      padding: 8px 14px calc(10px + var(--safe-bottom));
      background: color-mix(in srgb, var(--bg) 94%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      transition: transform 0.22s ease, opacity 0.22s ease;
    }

    .reader-bottombar.bars-hidden {
      transform: translateY(110%);
      opacity: 0;
      pointer-events: none;
    }

    .reader-bottom-inner {
      max-width: 720px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .tool-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 4px;
      border-radius: 10px;
      font-size: 11px;
      color: var(--text-sub);
    }

    .tool-btn.active {
      color: var(--warm);
      font-weight: 600;
    }

    .tool-btn:active { background: var(--surface-soft); }

    /* Selection Floating Bar (Docked at bottom to avoid iOS native popup) */
    .sel-bar {
      position: fixed;
      left: 50%;
      bottom: calc(18px + var(--safe-bottom));
      transform: translateX(-50%);
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow);
      max-width: calc(100vw - 24px);
    }

    .color-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid rgba(0, 0, 0, 0.12);
      flex-shrink: 0;
    }

    .color-dot.active {
      outline: 2px solid var(--text);
      outline-offset: 2px;
    }

    .dot-yellow { background: #F5D96B; }
    .dot-pink { background: #F2B0BC; }
    .dot-mint { background: #9DD9CC; }
    .dot-blue { background: #A5CAF6; }

    .sel-divider {
      width: 1px;
      height: 18px;
      background: var(--border-strong);
    }

    .sel-action-btn {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      padding: 2px 4px;
    }

    /* Excerpts View */
    .excerpts-wrap {
      padding: 14px 18px 36px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .excerpt-group {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .excerpt-group-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      background: var(--surface-soft);
    }

    .excerpt-book-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
    }

    .excerpt-book-meta {
      font-size: 12px;
      color: var(--text-sub);
      flex-shrink: 0;
    }

    .excerpt-item {
      padding: 15px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .excerpt-item:last-child { border-bottom: none; }

    .excerpt-quote-row {
      display: flex;
      gap: 11px;
      align-items: stretch;
      cursor: pointer;
    }

    .excerpt-bar {
      width: 3.5px;
      border-radius: 99px;
      flex-shrink: 0;
    }
    .bar-yellow { background: #E9C44C; }
    .bar-pink { background: #E393A2; }
    .bar-mint { background: #74BEA9; }
    .bar-blue { background: #7EAEE8; }

    .excerpt-quote-text {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
      word-break: break-word;
    }

    .excerpt-note-card {
      width: 100%;
      padding: 12px 14px;
      border-radius: 11px;
      background: var(--note-bg);
      border: 1px solid var(--note-border);
      font-size: 14px;
      line-height: 1.68;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .excerpt-note-label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--warm);
      margin-bottom: 4px;
    }

    .excerpt-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }

    .excerpt-foot-actions {
      display: flex;
      gap: 12px;
    }

    .link-btn {
      font-size: 12.5px;
      color: var(--text-sub);
    }

    .link-btn.danger { color: var(--danger); }

    /* Sheets & Modals */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(0, 0, 0, 0.36);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: fadeIn 0.16s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .sheet {
      width: 100%;
      max-width: 720px;
      max-height: 86vh;
      overflow-y: auto;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      padding: 16px 18px calc(22px + var(--safe-bottom));
      box-shadow: var(--shadow);
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .sheet-title {
      font-size: 16.5px;
      font-weight: 700;
    }

    .sheet-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--surface-soft);
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .input, .textarea, .select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 11px;
      border: 1px solid var(--border-strong);
      background: var(--bg);
      font-size: 14px;
      outline: none;
    }

    .textarea {
      min-height: 92px;
      resize: vertical;
      line-height: 1.6;
    }

    .btn-block {
      width: 100%;
      height: 44px;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg);
    }

    .btn-soft {
      background: var(--surface-soft);
      color: var(--text);
    }

    .btn-danger-soft {
      background: rgba(194, 75, 75, 0.12);
      color: var(--danger);
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .hint-box {
      padding: 11px 13px;
      border-radius: 11px;
      background: var(--surface-soft);
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--text-sub);
      margin-bottom: 14px;
    }

    /* Glossary Rules */
    .rule-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      margin-bottom: 8px;
    }

    .rule-main {
      flex: 1;
      min-width: 0;
    }

    .rule-map {
      font-size: 14px;
      font-weight: 600;
      word-break: break-word;
    }

    .rule-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .switch {
      position: relative;
      width: 42px;
      height: 24px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      border-radius: 99px;
      background: var(--border-strong);
      transition: 0.2s;
      cursor: pointer;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: #FFF;
      transition: 0.2s;
    }

    .switch input:checked + .slider {
      background: var(--warm);
    }

    .switch input:checked + .slider::before {
      transform: translateX(18px);
    }

    .adv-details {
      margin: 8px 0 12px;
      font-size: 13px;
      color: var(--text-sub);
    }

    .adv-details summary {
      cursor: pointer;
      padding: 4px 0;
      user-select: none;
    }

    /* Typography Sheet */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .theme-opt {
      padding: 12px 8px;
      border-radius: 12px;
      border: 1.5px solid var(--border-strong);
      text-align: center;
      font-size: 13px;
      font-weight: 600;
    }

    .theme-opt.active {
      border-color: var(--warm);
      box-shadow: 0 0 0 1px var(--warm);
    }

    .range-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .range-row input[type="range"] {
      flex: 1;
      accent-color: var(--warm);
    }

    /* Storage Stats */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-card {
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .stat-val {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .stat-lbl {
      font-size: 12px;
      color: var(--text-sub);
    }

    /* Reverse Lookup List */
    .lookup-card {
      padding: 11px 12px;
      border-radius: 11px;
      background: var(--bg);
      border: 1px solid var(--border);
      margin-bottom: 9px;
      font-size: 13.5px;
      line-height: 1.6;
    }

    .lookup-ko {
      font-size: 12.5px;
      color: var(--text-sub);
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed var(--border);
    }

    .lookup-hit {
      background: var(--hl-yellow);
      padding: 0 2px;
      border-radius: 3px;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: calc(16px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--text);
      color: var(--bg);
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow);
      max-width: calc(100vw - 32px);
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

  <!-- ==================== 通用弹窗容器 ==================== -->
  <div id="modal-root" class="hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <script>
    (() => {
      'use strict';

      /* ================= 1. 纯本地 IndexedDB 存储 ================= */
      const DB_NAME = 'postype_local_reader_db';
      const DB_VERSION = 1;
      let db = null;

      function openDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const d = e.target.result;
            if (!d.objectStoreNames.contains('articles')) d.createObjectStore('articles', { keyPath: 'id' });
            if (!d.objectStoreNames.contains('glossary')) d.createObjectStore('glossary', { keyPath: 'id' });
            if (!d.objectStoreNames.contains('highlights')) d.createObjectStore('highlights', { keyPath: 'id' });
            if (!d.objectStoreNames.contains('authors')) d.createObjectStore('authors', { keyPath: 'key' });
            if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'key' });
          };
          req.onsuccess = () => { db = req.result; resolve(db); };
          req.onerror = () => reject(req.error);
        });
      }

      const idbAll = (store) => new Promise((res, rej) => {
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).getAll();
        req.onsuccess = () => res(req.result || []);
        req.onerror = () => rej(req.error);
      });

      const idbPut = (store, val) => new Promise((res, rej) => {
        const tx = db.transaction(store, 'readwrite');
        const req = tx.objectStore(store).put(val);
        req.onsuccess = () => res(val);
        req.onerror = () => rej(req.error);
      });

      const idbDel = (store, key) => new Promise((res, rej) => {
        const tx = db.transaction(store, 'readwrite');
        const req = tx.objectStore(store).delete(key);
        req.onsuccess = () => res();
        req.onerror = () => rej(req.error);
      });

      const idbClear = (store) => new Promise((res, rej) => {
        const tx = db.transaction(store, 'readwrite');
        const req = tx.objectStore(store).clear();
        req.onsuccess = () => res();
        req.onerror = () => rej(req.error);
      });

      /* ================= 2. 全局应用状态 ================= */
      const state = {
        articles: [],
        glossary: [],
        highlights: [],
        authors: {}, // key -> { key, names: [], alias: '' }
        settings: {
          theme: 'light',
          fontSize: 17,
          lineHeight: 1.85,
          showRawTranslation: false
        },
        shelfFilter: 'all',
        groupByAuthor: false,
        searchQuery: '',
        excerptsSearch: '',
        prevViewBeforeExcerpts: 'shelf',
        currentArticleId: null,
        barsVisible: true,
        allKoExpanded: false,
        pendingSel: null
      };

      const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      const esc = (s) => String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      let toastTimer = null;
      function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.remove('hidden');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.add('hidden'), 2300);
      }

      /* ================= 3. 作者归档与中韩名称解析 ================= */
      function isUnknownName(name) {
        const s = (name || '').trim();
        return !s || s === '未知作者';
      }

      function isUnknownArticleAuthor(article) {
        return (
          isUnknownName(article.author) &&
          isUnknownName(article.authorZh) &&
          isUnknownName(article.authorKo) &&
          !article.authorHandle
        );
      }

      function normalizeAuthorKey(article) {
        if (article.authorKey && article.authorKey !== 'author_未知作者') {
          return article.authorKey;
        }
        if (article.authorHandle) {
          return 'handle_' + article.authorHandle.trim().toLowerCase();
        }
        const known = [article.authorKo, article.authorZh, article.author].find((n) => !isUnknownName(n));
        if (known) return 'author_' + known.trim().toLowerCase();
        return 'unknown_' + article.id;
      }

      function getAuthorDisplay(article) {
        const key = normalizeAuthorKey(article);
        const meta = state.authors[key];
        const alias = meta?.alias?.trim();
        const zh = isUnknownName(article.authorZh) ? (isUnknownName(article.author) ? '' : article.author.trim()) : article.authorZh.trim();
        const ko = isUnknownName(article.authorKo) ? '' : article.authorKo.trim();
        if (alias) {
          const orig = [zh, ko].find((n) => !isUnknownName(n) && n !== alias) || '';
          return { primary: alias, secondary: orig };
        }
        if (zh && ko && zh !== ko) return { primary: zh, secondary: ko };
        return { primary: zh || ko || article.authorHandle || '未知作者', secondary: '' };
      }

      function getAuthorSearchBlob(article) {
        const key = normalizeAuthorKey(article);
        const meta = state.authors[key];
        return [
          article.title,
          article.titleKo,
          isUnknownName(article.author) ? '' : article.author,
          isUnknownName(article.authorZh) ? '' : article.authorZh,
          isUnknownName(article.authorKo) ? '' : article.authorKo,
          article.authorHandle,
          meta?.alias,
          ...(meta?.names || []).filter((n) => !isUnknownName(n))
        ].filter(Boolean).join(' ').toLowerCase();
      }

      async function saveAuthorAlias(authorKey, alias, defaultNames = []) {
        if (!authorKey || authorKey === 'author_未知作者') return;
        const cleanNames = defaultNames.filter((n) => !isUnknownName(n));
        const existing = state.authors[authorKey] || { key: authorKey, names: cleanNames, alias: '' };
        existing.alias = alias.trim();
        existing.names = Array.from(new Set([...(existing.names || []).filter((n) => !isUnknownName(n)), ...cleanNames]));
        state.authors[authorKey] = existing;
        await idbPut('authors', existing);
      }

      /* ================= 4. 主题与排版应用 ================= */
      function applySettings() {
        document.body.dataset.theme = state.settings.theme || 'light';
        document.documentElement.style.setProperty('--reader-size', (state.settings.fontSize || 17) + 'px');
        document.documentElement.style.setProperty('--reader-lh', String(state.settings.lineHeight || 1.85));
        const themeColors = { light: '#FAF8F5', paper: '#F6EFE2', dark: '#151514' };
        document.getElementById('meta-theme-color').setAttribute('content', themeColors[state.settings.theme] || '#FAF8F5');
      }

      async function persistSettings() {
        await idbPut('settings', { key: 'prefs', value: state.settings });
      }

      /* ================= 5. 词元替换与高亮渲染（纯本地无损） ================= */
      function getApplicableRules(article) {
        if (state.settings.showRawTranslation) return [];
        const aKey = normalizeAuthorKey(article);
        return state.glossary.filter((r) => r.enabled !== false && (r.scope === 'global' || r.authorKey === aKey));
      }

      function applyGlossaryToParagraph(zhText, koText, rules) {
        let text = zhText || '';
        if (!text || !rules.length) return text;
        for (const r of rules) {
          const koAnchor = (r.koAnchor || '').trim();
          if (koAnchor && (!koText || !koText.includes(koAnchor))) continue;
          const variants = (r.from || '')
            .split(/[,，、\n]/)
            .map((v) => v.trim())
            .filter(Boolean)
            .sort((a, b) => b.length - a.length);
          for (const v of variants) {
            text = text.split(v).join(r.to || '');
          }
        }
        return text;
      }

      function renderHighlightedHtml(displayText, paraHighlights) {
        if (!paraHighlights.length) return esc(displayText);
        // 定位每个高亮片段在当前展示文本中的区间
        const ranges = [];
        for (const h of paraHighlights) {
          let start = -1;
          let end = -1;
          if (h.quote) {
            const idx = displayText.indexOf(h.quote, Math.max(0, (h.startOffset || 0) - 8));
            const fallbackIdx = idx >= 0 ? idx : displayText.indexOf(h.quote);
            if (fallbackIdx >= 0) {
              start = fallbackIdx;
              end = fallbackIdx + h.quote.length;
            }
          }
          if (start < 0 && typeof h.startOffset === 'number' && typeof h.endOffset === 'number') {
            start = Math.max(0, Math.min(displayText.length, h.startOffset));
            end = Math.max(start, Math.min(displayText.length, h.endOffset));
          }
          if (end > start) {
            ranges.push({ start, end, id: h.id, color: h.color || 'yellow' });
          }
        }
        if (!ranges.length) return esc(displayText);
        ranges.sort((a, b) => a.start - b.start);

        let html = '';
        let cursor = 0;
        for (const r of ranges) {
          if (r.start < cursor) continue;
          html += esc(displayText.slice(cursor, r.start));
          html += `<mark class="hl hl-${esc(r.color)}" data-hl-id="${esc(r.id)}">${esc(displayText.slice(r.start, r.end))}</mark>`;
          cursor = r.end;
        }
        html += esc(displayText.slice(cursor));
        return html;
      }

      /* ================= 6. 书架渲染 ================= */
      function renderShelf() {
        const container = document.getElementById('shelf-list');
        const q = state.searchQuery.trim().toLowerCase();

        let items = state.articles.slice().sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));

        if (state.shelfFilter === 'read') items = items.filter((a) => a.isRead);
        if (state.shelfFilter === 'unread') items = items.filter((a) => !a.isRead);
        if (q) items = items.filter((a) => getAuthorSearchBlob(a).includes(q));

        document.getElementById('btn-toggle-group').classList.toggle('active', state.groupByAuthor);
        document.getElementById('group-mode-label').textContent = state.groupByAuthor ? '按作者中' : '按作者';

        if (!items.length) {
          const isTrulyEmpty = state.articles.length === 0;
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-title">${isTrulyEmpty ? '书架还是空的' : '没有找到匹配的文章'}</div>
              <p class="empty-desc">${
                isTrulyEmpty
                  ? '在 iPhone Safari 打开 Postype 文章 → 点击底部分享 → 运行「提取 Postype 文章」快捷指令，再回到这里点右上角「+ 导入」即可离线收藏。'
                  : '换个关键词试试，或切换到「全部」分类查看。'
              }</p>
              ${isTrulyEmpty ? '<button class="primary-pill" style="margin:0 auto;" id="empty-import-btn">+ 导入第一篇文章</button>' : ''}
            </div>
          `;
          document.getElementById('empty-import-btn')?.addEventListener('click', openImportModal);
          return;
        }

        const renderCard = (a, hideAuthor = false) => {
          const authorDisp = getAuthorDisplay(a);
          const hasZh = a.blocks.some((b) => b.zh);
          const hasKo = a.blocks.some((b) => b.ko);
          const hasImg = a.blocks.some((b) => b.type === 'img');
          const pct = a.isRead ? 100 : Math.round((a.maxProgress || 0) * 100);
          const progText = a.isRead ? '已读' : (pct > 0 ? pct + '%' : '未读');
          const hlCount = state.highlights.filter((h) => h.articleId === a.id).length;

          return `
            <div class="book-card" data-open-id="${esc(a.id)}">
              <div class="book-card-top">
                <div class="book-title">${esc(a.title || a.titleKo || '未命名文章')}</div>
                <button class="card-more" data-menu-id="${esc(a.id)}" aria-label="更多操作">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
                </button>
              </div>
              <div class="book-meta">
                ${!hideAuthor ? `<span>${esc(authorDisp.primary)}${authorDisp.secondary ? ' · ' + esc(authorDisp.secondary) : ''}</span>` : ''}
                ${hasZh && hasKo ? '<span class="badge badge-bi">中/韩双语</span>' : hasKo ? '<span class="badge">仅韩文</span>' : '<span class="badge">仅中文</span>'}
                ${hasImg ? '<span class="badge">含插图</span>' : ''}
                ${hlCount ? `<span class="badge">${hlCount} 句摘录</span>` : ''}
              </div>
              <div class="progress-wrap">
                <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
                <div class="progress-label">${progText}</div>
              </div>
            </div>
          `;
        };

        if (!state.groupByAuthor) {
          container.innerHTML = items.map((a) => renderCard(a, false)).join('');
        } else {
          const groups = new Map();
          for (const a of items) {
            const k = normalizeAuthorKey(a);
            if (!groups.has(k)) groups.set(k, []);
            groups.get(k).push(a);
          }
          let html = '';
          for (const [aKey, list] of groups.entries()) {
            const disp = getAuthorDisplay(list[0]);
            html += `
              <section class="author-group">
                <div class="author-header">
                  <div class="author-title-wrap">
                    <span class="author-name">${esc(disp.primary)}</span>
                    ${disp.secondary ? `<span class="author-sub">${esc(disp.secondary)}</span>` : ''}
                    <span class="author-sub">${list.length} 篇</span>
                  </div>
                  <button class="author-edit-btn" data-edit-author="${esc(aKey)}">备注名</button>
                </div>
                <div style="display:flex;flex-direction:column;gap:10px;">
                  ${list.map((a) => renderCard(a, true)).join('')}
                </div>
              </section>
            `;
          }
          container.innerHTML = html;
        }
      }

      /* ================= 7. 阅读视图渲染与交互 ================= */
      function switchView(name) {
        document.getElementById('shelf-view').classList.toggle('hidden', name !== 'shelf');
        document.getElementById('reader-view').classList.toggle('hidden', name !== 'reader');
        document.getElementById('excerpts-view').classList.toggle('hidden', name !== 'excerpts');
        hideSelectionBar();
      }

      function openArticle(articleId, jumpPid = null) {
        const article = state.articles.find((a) => a.id === articleId);
        if (!article) return;
        state.currentArticleId = articleId;
        state.barsVisible = true;
        state.allKoExpanded = false;
        switchView('reader');
        renderReaderArticle(article);
        updateReaderBars();

        requestAnimationFrame(() => {
          if (jumpPid) {
            const target = document.querySelector(`.para-block[data-pid="${CSS.escape(jumpPid)}"]`);
            if (target) {
              target.scrollIntoView({ behavior: 'smooth', block: 'center' });
              target.classList.add('pulse');
              setTimeout(() => target.classList.remove('pulse'), 1400);
              return;
            }
          }
          const maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
          const y = Math.round((article.lastScrollRatio || 0) * maxScroll);
          window.scrollTo(0, y);
          // 若短文一屏即可看完，静默记为已读
          if (maxScroll <= 20 && !article.isRead) {
            article.maxProgress = 1;
            article.isRead = true;
            idbPut('articles', article);
          }
        });
      }

      function renderReaderArticle(article) {
        const disp = getAuthorDisplay(article);
        document.getElementById('reader-nav-title').textContent = article.title || article.titleKo || '未命名文章';

        const rules = getApplicableRules(article);
        const articleHls = state.highlights.filter((h) => h.articleId === article.id);
        const hasAnyKo = article.blocks.some((b) => b.ko);

        document.getElementById('btn-toggle-all-ko').classList.toggle('active', state.allKoExpanded);
        document.getElementById('label-all-ko').textContent = state.allKoExpanded ? '收起原文' : '全篇原文';

        let html = `
          <div class="article-head">
            <h1 class="article-title">${esc(article.title || article.titleKo || '未命名文章')}</h1>
            <div class="article-sub">
              <span>${esc(disp.primary)}${disp.secondary ? ' (' + esc(disp.secondary) + ')' : ''}</span>
              ${hasAnyKo ? '<span>· 双击任意段落可对照韩文原文</span>' : ''}
            </div>
          </div>
        `;

        for (const b of article.blocks) {
          if (b.type === 'hr') {
            html += '<hr class="para-hr" />';
            continue;
          }
          if (b.type === 'img') {
            const src = b.imgData || b.imgSrc || '';
            if (src) {
              html += `<div class="para-img-wrap"><img src="${esc(src)}" loading="lazy" alt="插图" /></div>`;
            }
            continue;
          }
          const rawZh = b.zh || b.ko || '';
          const displayZh = b.zh ? applyGlossaryToParagraph(b.zh, b.ko || '', rules) : rawZh;
          const pHls = articleHls.filter((h) => h.pid === b.pid);
          const zhHtml = renderHighlightedHtml(displayZh, pHls);
          const hasKo = Boolean(b.ko && b.zh);

          html += `
            <div class="para-block type-${esc(b.type || 'p')} ${state.allKoExpanded && hasKo ? 'show-ko' : ''}" data-pid="${esc(b.pid)}" data-has-ko="${hasKo ? '1' : '0'}">
              <div class="para-zh">${zhHtml}</div>
              ${hasKo ? `<div class="para-ko">${esc(b.ko)}</div>` : ''}
            </div>
          `;
        }

        document.getElementById('reader-article').innerHTML = html;
      }

      function updateReaderBars() {
        document.getElementById('reader-topbar').classList.toggle('bars-hidden', !state.barsVisible);
        document.getElementById('reader-bottombar').classList.toggle('bars-hidden', !state.barsVisible);
      }

      // 静默进度追踪（只进不退，滑过 95% 自动锁为已读，阅读页内不放已读按钮）
      let scrollSaveTimer = null;
      window.addEventListener('scroll', () => {
        if (!state.currentArticleId || document.getElementById('reader-view').classList.contains('hidden')) return;
        const article = state.articles.find((a) => a.id === state.currentArticleId);
        if (!article) return;

        const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        const ratio = Math.max(0, Math.min(1, window.scrollY / maxScroll));
        article.lastScrollRatio = ratio;
        if (ratio > (article.maxProgress || 0)) {
          article.maxProgress = ratio;
        }
        if (article.maxProgress >= 0.95 && !article.isRead) {
          article.isRead = true;
          article.maxProgress = 1;
        }
        clearTimeout(scrollSaveTimer);
        scrollSaveTimer = setTimeout(() => {
          idbPut('articles', article);
        }, 350);
      }, { passive: true });

      // 单击切换工具栏 & 双击段落展开/收起韩文原文（兼容 iOS Safari 触摸与桌面双击）
      let lastTapTime = 0;
      let lastTapPid = null;
      let singleTapTimer = null;

      document.getElementById('reader-article').addEventListener('click', (e) => {
        // 如果点击了已高亮句子，打开高亮编辑弹窗
        const mark = e.target.closest('mark.hl');
        if (mark) {
          const sel = window.getSelection();
          if (sel && sel.toString().trim().length > 0) return;
          e.stopPropagation();
          openHighlightEditModal(mark.dataset.hlId);
          return;
        }

        // 若正处于划词状态，不触发双击或工具栏隐藏
        const selText = (window.getSelection()?.toString() || '').trim();
        if (selText.length > 0) return;

        const block = e.target.closest('.para-block');
        const now = Date.now();

        if (block && block.dataset.pid === lastTapPid && (now - lastTapTime) < 330) {
          // 命中双击
          clearTimeout(singleTapTimer);
          lastTapTime = 0;
          lastTapPid = null;
          window.getSelection()?.removeAllRanges();
          hideSelectionBar();

          if (block.dataset.hasKo === '1') {
            block.classList.toggle('show-ko');
          } else {
            showToast('该文章尚未补录韩文原文');
          }
          return;
        }

        lastTapTime = now;
        lastTapPid = block ? block.dataset.pid : null;

        clearTimeout(singleTapTimer);
        singleTapTimer = setTimeout(() => {
          const curSel = (window.getSelection()?.toString() || '').trim();
          if (curSel.length > 0) return;
          state.barsVisible = !state.barsVisible;
          updateReaderBars();
        }, 280);
      });

      // 桌面浏览器双击兜底清除系统自动选词
      document.getElementById('reader-article').addEventListener('dblclick', (e) => {
        const block = e.target.closest('.para-block');
        if (!block) return;
        window.getSelection()?.removeAllRanges();
        hideSelectionBar();
      });

      /* ================= 8. 荧光笔划词 & 词元快捷入口 ================= */
      function hideSelectionBar() {
        state.pendingSel = null;
        document.getElementById('sel-bar').classList.add('hidden');
      }

      function computeTextOffset(container, node, offset) {
        const range = document.createRange();
        range.selectNodeContents(container);
        try {
          range.setEnd(node, offset);
          return range.toString().length;
        } catch {
          return 0;
        }
      }

      let selDebounce = null;
      document.addEventListener('selectionchange', () => {
        if (document.getElementById('reader-view').classList.contains('hidden')) return;
        clearTimeout(selDebounce);
        selDebounce = setTimeout(inspectSelection, 140);
      });

      function inspectSelection() {
        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) {
          hideSelectionBar();
          return;
        }
        const text = sel.toString().trim();
        if (!text || text.length > 600) {
          hideSelectionBar();
          return;
        }

        const anchorEl = sel.anchorNode?.nodeType === 3 ? sel.anchorNode.parentElement : sel.anchorNode;
        const block = anchorEl?.closest?.('.para-block');
        if (!block) {
          hideSelectionBar();
          return;
        }

        const koEl = anchorEl?.closest?.('.para-ko');
        const zhEl = anchorEl?.closest?.('.para-zh');
        if (!koEl && !zhEl) {
          hideSelectionBar();
          return;
        }

        const isKo = Boolean(koEl);
        let startOffset = 0;
        let endOffset = text.length;
        if (zhEl && sel.rangeCount > 0) {
          const r = sel.getRangeAt(0);
          startOffset = computeTextOffset(zhEl, r.startContainer, r.startOffset);
          endOffset = startOffset + text.length;
        }

        state.pendingSel = {
          pid: block.dataset.pid,
          text,
          isKo,
          startOffset,
          endOffset
        };

        const bar = document.getElementById('sel-bar');
        if (isKo) {
          bar.innerHTML = `<button class="sel-action-btn" data-sel-action="lookup-ko">查此韩词在全文中的译法</button>`;
        } else {
          bar.innerHTML = `
            <button class="color-dot dot-yellow" data-hl-color="yellow" aria-label="暖黄高亮"></button>
            <button class="color-dot dot-pink" data-hl-color="pink" aria-label="雾粉高亮"></button>
            <button class="color-dot dot-mint" data-hl-color="mint" aria-label="浅青高亮"></button>
            <button class="color-dot dot-blue" data-hl-color="blue" aria-label="冰蓝高亮"></button>
            <div class="sel-divider"></div>
            <button class="sel-action-btn" data-sel-action="fix-word">纠错此词</button>
          `;
        }
        bar.classList.remove('hidden');
      }

      document.getElementById('sel-bar').addEventListener('pointerdown', (e) => {
        // 阻止点击按钮导致 iOS 立即清空选区
        e.preventDefault();
      });

      document.getElementById('sel-bar').addEventListener('click', async (e) => {
        const snap = state.pendingSel;
        if (!snap) return;

        const colorBtn = e.target.closest('[data-hl-color]');
        if (colorBtn) {
          const color = colorBtn.dataset.hlColor;
          const hl = {
            id: uid(),
            articleId: state.currentArticleId,
            pid: snap.pid,
            quote: snap.text,
            color,
            note: '',
            startOffset: snap.startOffset,
            endOffset: snap.endOffset,
            createdAt: Date.now()
          };
          state.highlights.push(hl);
          await idbPut('highlights', hl);
          window.getSelection()?.removeAllRanges();
          hideSelectionBar();
          const art = state.articles.find((a) => a.id === state.currentArticleId);
          if (art) renderReaderArticle(art);
          showToast('已收入好句摘录，轻点句子可写感受');
          return;
        }

        const actBtn = e.target.closest('[data-sel-action]');
        if (!actBtn) return;
        const action = actBtn.dataset.selAction;
        window.getSelection()?.removeAllRanges();
        hideSelectionBar();

        if (action === 'fix-word') {
          openGlossaryModal(snap.text);
        } else if (action === 'lookup-ko') {
          openKoLookupModal(snap.text);
        }
      });

      /* ================= 9. 好句摘录视图（按作品分组） ================= */
      function renderExcerpts() {
        const listEl = document.getElementById('excerpts-list');
        const q = state.excerptsSearch.trim().toLowerCase();

        // 按作品分组
        const groups = new Map();
        for (const h of state.highlights) {
          const art = state.articles.find((a) => a.id === h.articleId);
          if (!art) continue;
          if (q) {
            const hay = `${h.quote} ${h.note || ''} ${art.title || ''} ${getAuthorSearchBlob(art)}`.toLowerCase();
            if (!hay.includes(q)) continue;
          }
          if (!groups.has(art.id)) groups.set(art.id, { article: art, items: [] });
          groups.get(art.id).items.push(h);
        }

        let total = 0;
        for (const g of groups.values()) total += g.items.length;
        document.getElementById('excerpts-count').textContent = total ? `共 ${total} 条` : '';

        if (!groups.size) {
          listEl.innerHTML = `
            <div class="empty-state">
              <div class="empty-title">还没有摘录好句</div>
              <p class="empty-desc">在阅读文章时划选喜欢的中文句子，点击底部荧光笔即可高亮收藏，并写下自己的感受。</p>
            </div>
          `;
          return;
        }

        let html = '';
        for (const { article, items } of groups.values()) {
          const pidOrder = new Map(article.blocks.map((b, i) => [b.pid, i]));
          items.sort((a, b) => (pidOrder.get(a.pid) ?? 9999) - (pidOrder.get(b.pid) ?? 9999));
          const authorDisp = getAuthorDisplay(article);

          html += `
            <section class="excerpt-group">
              <div class="excerpt-group-head">
                <div class="excerpt-book-title">${esc(article.title || article.titleKo || '未命名文章')}</div>
                <div class="excerpt-book-meta">${esc(authorDisp.primary)} · ${items.length} 条</div>
              </div>
              ${items.map((h) => `
                <div class="excerpt-item">
                  <div class="excerpt-quote-row" data-jump-art="${esc(article.id)}" data-jump-pid="${esc(h.pid)}">
                    <div class="excerpt-bar bar-${esc(h.color || 'yellow')}"></div>
                    <div class="excerpt-quote-text">${esc(h.quote)}</div>
                  </div>
                  ${h.note ? `
                    <div class="excerpt-note-card">
                      <span class="excerpt-note-label">我的感受</span>${esc(h.note)}
                    </div>
                  ` : ''}
                  <div class="excerpt-foot">
                    <span>${new Date(h.createdAt).toLocaleDateString('zh-CN')}</span>
                    <div class="excerpt-foot-actions">
                      <button class="link-btn" data-edit-hl="${esc(h.id)}">${h.note ? '编辑感受' : '写感受'}</button>
                      <button class="link-btn danger" data-del-hl="${esc(h.id)}">删除</button>
                    </div>
                  </div>
                </div>
              `).join('')}
            </section>
          `;
        }
        listEl.innerHTML = html;
      }

      /* ================= 10. 弹窗系统 ================= */
      const modalRoot = document.getElementById('modal-root');

      function openModal(innerHtml) {
        modalRoot.innerHTML = `
          <div class="overlay" id="modal-overlay">
            <div class="sheet" role="dialog" aria-modal="true">${innerHtml}</div>
          </div>
        `;
        modalRoot.classList.remove('hidden');
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
          if (e.target.id === 'modal-overlay') closeModal();
        });
        modalRoot.querySelector('[data-close-modal]')?.addEventListener('click', closeModal);
      }

      function closeModal() {
        modalRoot.innerHTML = '';
        modalRoot.classList.add('hidden');
      }

      /* --- 弹窗 A：导入文章 / 双语合并 --- */
      function openImportModal() {
        openModal(`
          <div class="sheet-head">
            <div class="sheet-title">导入文章 / 双语合并</div>
            <button class="sheet-close" data-close-modal>✕</button>
          </div>
          <div class="hint-box">
            <strong>快捷导入：</strong>在 Safari 分享菜单运行「提取 Postype 文章」后，直接点下方按钮即可自动入库。<br/>
            同一篇文章分别提取中文版和韩文版时，系统会按段落 <code>data-pid</code> 自动合并成双语对照。
          </div>
          <button class="btn-block btn-primary" id="btn-import-clipboard" style="margin-bottom:6px;">
            读取剪贴板直接导入
          </button>
          <div style="font-size:12px;color:var(--text-muted);text-align:center;margin-bottom:12px;">
            iPhone 点击后会弹出系统「粘贴」确认气泡，点一下气泡即可完成导入
          </div>
          <div class="field">
            <label>或手动粘贴提取结果</label>
            <textarea id="import-paste-box" class="textarea" placeholder="若系统未自动读取剪贴板，可长按此处粘贴后点击导入"></textarea>
          </div>
          <div class="btn-row">
            <button class="btn-block btn-soft" id="btn-import-paste">导入文本框内容</button>
            <button class="btn-block btn-soft" id="btn-import-file">选择 .json 文件</button>
          </div>
          <input type="file" id="import-file-input" accept=".json,application/json,text/plain" class="hidden" />
        `);

        document.getElementById('btn-import-clipboard').addEventListener('click', async () => {
          try {
            const text = await navigator.clipboard.readText();
            if (!text || !text.trim()) {
              showToast('剪贴板为空，请先在 Safari 运行提取快捷指令');
              return;
            }
            await handleImportRaw(text);
          } catch {
            showToast('浏览器未授予剪贴板权限，请长按下方输入框粘贴');
            document.getElementById('import-paste-box').focus();
          }
        });

        document.getElementById('btn-import-paste').addEventListener('click', async () => {
          const text = document.getElementById('import-paste-box').value;
          if (!text.trim()) return showToast('请先粘贴提取内容');
          await handleImportRaw(text);
        });

        const fileInput = document.getElementById('import-file-input');
        document.getElementById('btn-import-file').addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', async (e) => {
          const f = e.target.files?.[0];
          if (!f) return;
          const text = await f.text();
          await handleImportRaw(text);
        });
      }

      async function handleImportRaw(rawText) {
        let data;
        try {
          data = JSON.parse(rawText.trim());
        } catch {
          showToast('内容格式不是有效的 Postype 提取数据');
          return;
        }
        if (data.error) {
          showToast(data.error);
          return;
        }
        // 支持完整备份恢复防呆提示
        if (data._backupType === 'postype-local-full-backup') {
          showToast('这是完整书架备份文件，请到「存储与备份」里恢复');
          return;
        }
        if (!Array.isArray(data.blocks) || !data.blocks.length) {
          showToast('未检测到有效正文段落');
          return;
        }

        const lang = data.lang === 'ko' ? 'ko' : 'zh';
        const cleanUrl = (data.sourceUrl || '').replace(/\/+$/, '');
        const postId = data.postId || '';

        // 匹配已存在文章（方案 A 自动合并）
        let existing = state.articles.find((a) =>
          (cleanUrl && a.sourceUrl === cleanUrl) ||
          (postId && a.postId && a.postId === postId)
        );

        if (existing) {
          // 合并标题与作者中韩名（绝不用“未知作者”覆盖已有作者名）
          const incomingAuthor = isUnknownName(data.author) ? '' : data.author.trim();
          if (data.authorHandle && !existing.authorHandle) {
            existing.authorHandle = data.authorHandle.trim();
          }
          if (lang === 'zh') {
            existing.title = data.title || existing.title;
            if (incomingAuthor) {
              existing.authorZh = incomingAuthor;
              if (isUnknownName(existing.author)) existing.author = incomingAuthor;
            }
          } else {
            existing.titleKo = data.title || existing.titleKo;
            if (incomingAuthor) {
              existing.authorKo = incomingAuthor;
              if (isUnknownName(existing.author)) existing.author = incomingAuthor;
            }
            if (!existing.title) existing.title = data.title;
          }
          if (existing.authorKey.startsWith('unknown_') && (incomingAuthor || existing.authorHandle)) {
            existing.authorKey = existing.authorHandle
              ? 'handle_' + existing.authorHandle.toLowerCase()
              : 'author_' + incomingAuthor.toLowerCase();
          }
          const aKey = normalizeAuthorKey(existing);
          if (!aKey.startsWith('unknown_')) {
            await saveAuthorAlias(aKey, state.authors[aKey]?.alias || '', [existing.authorZh, existing.authorKo, incomingAuthor]);
          }

          // 按 data-pid 精确对齐合并段落，同时保留已有图片
          const byPid = new Map();
          const bySort = new Map();
          existing.blocks.forEach((b, idx) => {
            if (b.pid) byPid.set(b.pid, b);
            if (b.sort) bySort.set(String(b.sort), b);
          });

          let matchedCount = 0;
          const incomingTextBlocks = data.blocks.filter((b) => b.type !== 'img' && b.type !== 'hr');
          const existingTextBlocks = existing.blocks.filter((b) => b.type !== 'img' && b.type !== 'hr');

          incomingTextBlocks.forEach((inc, idx) => {
            let target = byPid.get(inc.pid) || (inc.sort ? bySort.get(String(inc.sort)) : null);
            if (!target && existingTextBlocks.length === incomingTextBlocks.length) {
              target = existingTextBlocks[idx];
            }
            if (target) {
              target[lang] = inc.text;
              matchedCount++;
            } else {
              existing.blocks.push({
                pid: inc.pid,
                sort: inc.sort,
                type: inc.type || 'p',
                zh: lang === 'zh' ? inc.text : '',
                ko: lang === 'ko' ? inc.text : ''
              });
            }
          });

          // 补齐之前可能缺失的本地图片
          const existingImgSrcs = new Set(existing.blocks.filter((b) => b.type === 'img').map((b) => b.imgSrc));
          for (const inc of data.blocks) {
            if (inc.type === 'img' && inc.imgSrc && !existingImgSrcs.has(inc.imgSrc)) {
              existing.blocks.push({
                pid: inc.pid,
                sort: inc.sort,
                type: 'img',
                imgData: inc.imgData || '',
                imgSrc: inc.imgSrc
              });
            }
          }

          existing.updatedAt = Date.now();
          await idbPut('articles', existing);
          closeModal();
          renderShelf();
          showToast(`已合并${lang === 'ko' ? '韩文原文' : '中文译文'}（精准对齐 ${matchedCount} 段）`);
          return;
        }

        // 全新入库（若提取不到作者，使用独立 unknown_id，绝不串染其他文章）
        const newId = uid();
        const rawAuthor = (data.author || '').trim();
        const authorHandle = (data.authorHandle || '').trim();
        const hasKnownAuthor = !isUnknownName(rawAuthor);
        const authorName = hasKnownAuthor ? rawAuthor : (authorHandle || '未知作者');
        const authorKey = authorHandle
          ? 'handle_' + authorHandle.toLowerCase()
          : (hasKnownAuthor ? 'author_' + rawAuthor.toLowerCase() : 'unknown_' + newId);
        const newArticle = {
          id: newId,
          postId,
          sourceUrl: cleanUrl,
          title: lang === 'zh' ? (data.title || '未命名文章') : '',
          titleKo: lang === 'ko' ? (data.title || '') : '',
          author: authorName,
          authorZh: lang === 'zh' && hasKnownAuthor ? rawAuthor : '',
          authorKo: lang === 'ko' && hasKnownAuthor ? rawAuthor : '',
          authorHandle,
          authorKey,
          blocks: data.blocks.map((b) => {
            if (b.type === 'img') {
              return { pid: b.pid, sort: b.sort, type: 'img', imgData: b.imgData || '', imgSrc: b.imgSrc || '' };
            }
            if (b.type === 'hr') {
              return { pid: b.pid, sort: b.sort, type: 'hr' };
            }
            return {
              pid: b.pid,
              sort: b.sort,
              type: b.type || 'p',
              zh: lang === 'zh' ? (b.text || '') : '',
              ko: lang === 'ko' ? (b.text || '') : ''
            };
          }),
          lastScrollRatio: 0,
          maxProgress: 0,
          isRead: false,
          createdAt: Date.now(),
          updatedAt: Date.now()
        };
        if (!newArticle.title) newArticle.title = newArticle.titleKo || '未命名文章';

        state.articles.unshift(newArticle);
        await idbPut('articles', newArticle);
        if (!authorKey.startsWith('unknown_')) {
          await saveAuthorAlias(authorKey, state.authors[authorKey]?.alias || '', [authorName]);
        }
        closeModal();
        renderShelf();
        showToast(`已导入《${newArticle.title}》(${lang === 'ko' ? '韩文原版' : '中文译版'})`);
      }

      /* --- 弹窗 G：本地存储与备份 --- */
      function formatBytes(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
      }

      function byteLen(obj) {
        return new Blob([JSON.stringify(obj)]).size;
      }

      function triggerDownload(filename, content, mime) {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function openStorageModal() {
        let imgBytes = 0;
        let textBytes = 0;
        for (const a of state.articles) {
          for (const b of a.blocks) {
            if (b.type === 'img' && b.imgData) imgBytes += b.imgData.length;
          }
          const copy = { ...a, blocks: a.blocks.map((b) => b.type === 'img' ? { ...b, imgData: '' } : b) };
          textBytes += byteLen(copy);
        }
        const metaBytes = byteLen(state.glossary) + byteLen(state.highlights) + byteLen(state.authors);
        const totalBytes = textBytes + imgBytes + metaBytes;

        openModal(`
          <div class="sheet-head">
            <div class="sheet-title">本地存储与备份</div>
            <button class="sheet-close" data-close-modal>✕</button>
          </div>
          <div class="hint-box">
            所有文章、插图、词库和摘录均 <strong>100% 离线存在本机浏览器数据库</strong>，零云端上传，绝不接入任何大模型。
          </div>
          <div class="stat-grid">
            <div class="stat-card">
              <div class="stat-val">${formatBytes(totalBytes)}</div>
              <div class="stat-lbl">本机实际占用总计</div>
            </div>
            <div class="stat-card">
              <div class="stat-val">${state.articles.length} 篇</div>
              <div class="stat-lbl">已收藏文章</div>
            </div>
            <div class="stat-card">
              <div class="stat-val">${formatBytes(imgBytes)}</div>
              <div class="stat-lbl">离线插图占用</div>
            </div>
            <div class="stat-card">
              <div class="stat-val">${state.highlights.length} 条 / ${state.glossary.length} 条</div>
              <div class="stat-lbl">好句摘录 / 词元规则</div>
            </div>
          </div>

          <div style="font-size:12.5px;font-weight:600;color:var(--text-sub);margin:14px 0 8px;">完整换机备份（供软件恢复用）</div>
          <div class="btn-row" style="margin-bottom:14px;">
            <button class="btn-block btn-primary" id="btn-export-json">导出备份 (.json)</button>
            <button class="btn-block btn-soft" id="btn-restore-json">从备份恢复</button>
          </div>
          <input type="file" id="restore-file-input" accept=".json,application/json" class="hidden" />

          <div style="font-size:12.5px;font-weight:600;color:var(--text-sub);margin:10px 0 8px;">直接可读的纯文本导出（手机/电脑直接看）</div>
          <div class="btn-row">
            <button class="btn-block btn-soft" id="btn-export-excerpts-txt">导出好句摘录 (.txt)</button>
            <button class="btn-block btn-soft" id="btn-export-articles-txt">导出全部文章 (.txt)</button>
          </div>
        `);

        const dateTag = new Date().toISOString().slice(0, 10);

        document.getElementById('btn-export-json').addEventListener('click', () => {
          const backup = {
            _backupType: 'postype-local-full-backup',
            version: 1,
            exportedAt: Date.now(),
            articles: state.articles,
            glossary: state.glossary,
            highlights: state.highlights,
            authors: state.authors,
            settings: state.settings
          };
          triggerDownload(`postype-backup-${dateTag}.json`, JSON.stringify(backup), 'application/json');
          showToast('已导出完整备份');
        });

        const restoreInput = document.getElementById('restore-file-input');
        document.getElementById('btn-restore-json').addEventListener('click', () => restoreInput.click());
        restoreInput.addEventListener('change', async (e) => {
          const f = e.target.files?.[0];
          if (!f) return;
          try {
            const parsed = JSON.parse(await f.text());
            if (parsed._backupType !== 'postype-local-full-backup') {
              return showToast('所选文件不是有效的书架备份');
            }
            if (!confirm('恢复备份将覆盖当前书架数据，确定继续吗？')) return;
            await Promise.all([idbClear('articles'), idbClear('glossary'), idbClear('highlights'), idbClear('authors')]);
            state.articles = parsed.articles || [];
            state.glossary = parsed.glossary || [];
            state.highlights = parsed.highlights || [];
            state.authors = parsed.authors || {};
            if (parsed.settings) state.settings = { ...state.settings, ...parsed.settings };

            for (const a of state.articles) await idbPut('articles', a);
            for (const g of state.glossary) await idbPut('glossary', g);
            for (const h of state.highlights) await idbPut('highlights', h);
            for (const au of Object.values(state.authors)) await idbPut('authors', au);
            await persistSettings();
            applySettings();
            closeModal();
            renderShelf();
            showToast(`已恢复 ${state.articles.length} 篇文章`);
          } catch {
            showToast('读取备份失败，文件可能已损坏');
          }
        });

        document.getElementById('btn-export-excerpts-txt').addEventListener('click', () => {
          if (!state.highlights.length) return showToast('暂无可导出的好句摘录');
          const lines = [];
          for (const art of state.articles) {
            const hls = state.highlights.filter((h) => h.articleId === art.id);
            if (!hls.length) continue;
            const disp = getAuthorDisplay(art);
            lines.push(`《${art.title || art.titleKo}》 — ${disp.primary}`);
            lines.push('----------------------------------------');
            for (const h of hls) {
              lines.push(`「${h.quote}」`);
              if (h.note) lines.push(`  我的感受：${h.note}`);
              lines.push('');
            }
            lines.push('');
          }
          triggerDownload(`postype-好句摘录-${dateTag}.txt`, lines.join('\n'), 'text/plain;charset=utf-8');
          showToast('已导出好句纯文本');
        });

        document.getElementById('btn-export-articles-txt').addEventListener('click', () => {
          if (!state.articles.length) return showToast('书架暂无文章');
          const lines = [];
          for (const art of state.articles) {
            const disp = getAuthorDisplay(art);
            const rules = getApplicableRules(art);
            lines.push(`========================================`);
            lines.push(`《${art.title || art.titleKo}》`);
            lines.push(`作者：${disp.primary}${disp.secondary ? ' (' + disp.secondary + ')' : ''}`);
            lines.push(`========================================\n`);
            for (const b of art.blocks) {
              if (b.type === 'hr') { lines.push('***\n'); continue; }
              if (b.type === 'img') { lines.push('[插图]\n'); continue; }
              const txt = b.zh ? applyGlossaryToParagraph(b.zh, b.ko || '', rules) : (b.ko || '');
              if (txt) lines.push(txt + '\n');
            }
            lines.push('\n');
          }
          triggerDownload(`postype-全部文章-${dateTag}.txt`, lines.join('\n'), 'text/plain;charset=utf-8');
          showToast('已导出全部文章纯文本');
        });
      }

      /* ================= 11. 全局事件绑定 ================= */
      document.getElementById('btn-open-import').addEventListener('click', openImportModal);
      document.getElementById('btn-open-storage').addEventListener('click', openStorageModal);

      document.getElementById('btn-open-excerpts').addEventListener('click', () => {
        state.prevViewBeforeExcerpts = 'shelf';
        switchView('excerpts');
        renderExcerpts();
      });

      document.getElementById('btn-reader-excerpts').addEventListener('click', () => {
        state.prevViewBeforeExcerpts = 'reader';
        switchView('excerpts');
        renderExcerpts();
      });

      document.getElementById('btn-excerpts-back').addEventListener('click', () => {
        if (state.prevViewBeforeExcerpts === 'reader' && state.currentArticleId) {
          switchView('reader');
        } else {
          switchView('shelf');
          renderShelf();
        }
      });

      document.getElementById('btn-back-shelf').addEventListener('click', () => {
        state.currentArticleId = null;
        switchView('shelf');
        renderShelf();
      });

      document.getElementById('btn-open-glossary').addEventListener('click', () => openGlossaryModal());
      document.getElementById('btn-open-typo').addEventListener('click', openTypoModal);

      document.getElementById('btn-toggle-all-ko').addEventListener('click', () => {
        const art = state.articles.find((a) => a.id === state.currentArticleId);
        if (!art) return;
        const hasKo = art.blocks.some((b) => b.ko && b.zh);
        if (!hasKo) return showToast('该文章尚未补录韩文原文');
        state.allKoExpanded = !state.allKoExpanded;
        renderReaderArticle(art);
      });

      // 书架筛选与搜索
      document.getElementById('status-tabs').addEventListener('click', (e) => {
        const btn = e.target.closest('.seg-tab');
        if (!btn) return;
        state.shelfFilter = btn.dataset.status;
        document.querySelectorAll('#status-tabs .seg-tab').forEach((b) => b.classList.toggle('active', b === btn));
        renderShelf();
      });

      document.getElementById('btn-toggle-group').addEventListener('click', () => {
        state.groupByAuthor = !state.groupByAuthor;
        renderShelf();
      });

      const shelfSearch = document.getElementById('shelf-search');
      const searchClear = document.getElementById('shelf-search-clear');
      shelfSearch.addEventListener('input', () => {
        state.searchQuery = shelfSearch.value;
        searchClear.classList.toggle('hidden', !state.searchQuery);
        renderShelf();
      });
      searchClear.addEventListener('click', () => {
        shelfSearch.value = '';
        state.searchQuery = '';
        searchClear.classList.add('hidden');
        renderShelf();
      });

      document.getElementById('excerpts-search').addEventListener('input', (e) => {
        state.excerptsSearch = e.target.value;
        renderExcerpts();
      });

      // 书架卡片点击委托
      document.getElementById('shelf-list').addEventListener('click', (e) => {
        const editAuthorBtn = e.target.closest('[data-edit-author]');
        if (editAuthorBtn) {
          e.stopPropagation();
          openAuthorAliasModal(editAuthorBtn.dataset.editAuthor);
          return;
        }
        const moreBtn = e.target.closest('[data-menu-id]');
        if (moreBtn) {
          e.stopPropagation();
          openArticleMenuModal(moreBtn.dataset.menuId);
          return;
        }
        const card = e.target.closest('[data-open-id]');
        if (card) {
          openArticle(card.dataset.openId);
        }
      });

      // 好句摘录点击委托
      document.getElementById('excerpts-list').addEventListener('click', async (e) => {
        const editBtn = e.target.closest('[data-edit-hl]');
        if (editBtn) {
          openHighlightEditModal(editBtn.dataset.editHl);
          return;
        }
        const delBtn = e.target.closest('[data-del-hl]');
        if (delBtn) {
          const id = delBtn.dataset.delHl;
          state.highlights = state.highlights.filter((x) => x.id !== id);
          await idbDel('highlights', id);
          renderExcerpts();
          showToast('已删除');
          return;
        }
        const jumpEl = e.target.closest('[data-jump-art]');
        if (jumpEl) {
          openArticle(jumpEl.dataset.jumpArt, jumpEl.dataset.jumpPid);
        }
      });

      /* ================= 12. 启动初始化 & 离线 Service Worker ================= */
      async function init() {
        await openDB();
        const [articles, glossary, highlights, authorsList, settingsList] = await Promise.all([
          idbAll('articles'),
          idbAll('glossary'),
          idbAll('highlights'),
          idbAll('authors'),
          idbAll('settings')
        ]);

        state.articles = articles;
        state.glossary = glossary;
        state.highlights = highlights;
        for (const au of authorsList) state.authors[au.key] = au;

        // 清理旧版残留的“author_未知作者”共享键，防止备注名串染
        if (state.authors['author_未知作者']) {
          delete state.authors['author_未知作者'];
          await idbDel('authors', 'author_未知作者');
        }
        for (const a of state.articles) {
          if (a.authorKey === 'author_未知作者' || (!a.authorKey && isUnknownArticleAuthor(a))) {
            a.authorKey = 'unknown_' + a.id;
            await idbPut('articles', a);
          }
        }
        const prefs = settingsList.find((s) => s.key === 'prefs')?.value;
        if (prefs) state.settings = { ...state.settings, ...prefs };

        applySettings();
        renderShelf();

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
      }

      init();
    })();
  </script>
</body>
</html>
